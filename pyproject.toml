[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-orbit"
version = "1.8.8"
description = "AI-powered codebase editor using local llama.cpp models"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openai>=2.31",
    "numpy>=2.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.3",
    "rich>=13.0.0",
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "httpx>=0.24.0",
]

[project.scripts]
llm-agent = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "workflow*", "api*"]
